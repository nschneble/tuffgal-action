name: Tuffgal
description: Run visual regression stories with Tuffgal in CI mode. Parses results, uploads artifacts, posts comments for review.
author: Nick Schneble
branding:
  icon: eye
  color: purple

inputs:
  baselines-path:
    description: Path to the baselines directory. Must match `paths.baselines` in tuffgal.config.ts. Relative to working-directory.
    required: false
    default: "tuffgal/baselines"
  coverage:
    description: Run with `--coverage` to capture V8 JS + CSS coverage and emit a monocart report.
    required: false
    default: "false"
  fail-on-changed:
    description: Fail the job when stories have pending visual changes (`new`, `changed`, or `deleted`) awaiting review. Defaults to true — visual changes are a PR review gate under the CI-owned-baselines model. Set to false to let changes surface via artifact + comment without blocking the job.
    required: false
    default: "true"
  headed:
    description: Run with `--headed`. Rarely useful in CI; defaults to false.
    required: false
    default: "false"
  install-browsers:
    description: Run `npx playwright install --with-deps chromium` before the harness. Disable if the consumer's npm ci already installs browsers.
    required: false
    default: "true"
  node-version:
    description: Node.js version for setup-node. Tuffgal requires Node 22+.
    required: false
    default: "22"
  pages-branch:
    description: Branch the per-PR preview is published to. Only used when pages-preview is true.
    required: false
    default: "gh-pages"
  pages-preview:
    description: >-
      Publish the report + baselines to a per-PR GitHub Pages preview
      (gh-pages branch, `pr-<n>/` subdir) so the PR comment can deep-link
      straight to a changed story with its screenshots expanded — no artifact
      download. Requires Pages enabled on the repo and `contents: write` on the
      job. Degrades gracefully: if publish or URL resolution fails, the comment
      falls back to the artifact-download links. PUBLIC repos only (private
      Pages is Enterprise-only). Set to false to skip.
    required: false
    default: "true"
  pages-token:
    description: >-
      Token used to push the preview branch AND to auto-enable Pages on the
      first run. Defaults to `GITHUB_TOKEN`, which can push (with
      `contents: write`) but CANNOT create the Pages site — GitHub reserves site
      creation for a repo-admin credential, so with the default token you must
      enable Pages once by hand (Settings → Pages → source: the pages branch).
      Supply a PAT or GitHub App installation token with admin/Pages write to
      have the first run enable Pages for you.
    required: false
    default: ${{ github.token }}
  report-path:
    description: Path to the report directory written by Tuffgal. Must match `paths.report` in tuffgal.config.ts. Relative to working-directory.
    required: false
    default: "tuffgal/report"
  retention-days:
    description: Artifact retention in days.
    required: false
    default: "14"
  setup-script:
    description: Optional npm script to run before the harness. Useful for DB bootstrap (e.g. 'test:ui:setup'). Leave empty to skip.
    required: false
    default: ""
  story:
    description: Optional `--story <name>` filter to run a single story by filename or text match.
    required: false
    default: ""
  upload-artifacts:
    description: Upload the report + candidate baselines as workflow artifacts when visual changes await review. Disable for fully ephemeral pipelines.
    required: false
    default: "true"
  working-directory:
    description: Directory containing tuffgal.config.ts and package.json. Most projects can leave this as '.'.
    required: false
    default: "."

outputs:
  changed:
    description: Number of stories whose committed baseline changed (pixels or a11y snapshot drifted).
    value: ${{ steps.outcome.outputs.changed }}
  deleted:
    description: Number of orphaned baseline entries with no matching story/action (pruned on approve).
    value: ${{ steps.outcome.outputs.deleted }}
  env-mismatch:
    description: "'true' when the capture environment recorded in baselines/manifest.json no longer matches this CI environment (expect a full re-approve), else 'false'."
    value: ${{ steps.outcome.outputs.env-mismatch }}
  failed:
    description: Number of stories that failed (steps threw / broken).
    value: ${{ steps.outcome.outputs.failed }}
  new:
    description: Number of stories with no committed baseline yet (candidate written, awaiting first approval).
    value: ${{ steps.outcome.outputs.new }}
  outcome:
    description: One of 'pass', 'changed' (pending new/changed/deleted visual review), 'env-mismatch', 'failed', or 'no-results' if results.json was not written.
    value: ${{ steps.outcome.outputs.outcome }}
  passed:
    description: Number of stories that passed.
    value: ${{ steps.outcome.outputs.passed }}
  preview-url:
    description: "Base URL of the per-PR GitHub Pages preview (e.g. https://owner.github.io/repo/pr-41), or empty when pages-preview is off or publishing was skipped/failed. Append `/report/index.html` for the report."
    value: ${{ steps.pages.outputs.preview-url }}
  total:
    description: Total number of stories executed.
    value: ${{ steps.outcome.outputs.total }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Install Playwright browsers
      if: inputs.install-browsers == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    - name: Run setup script
      if: inputs.setup-script != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TUFFGAL_SETUP_SCRIPT: ${{ inputs.setup-script }}
      run: npm run "$TUFFGAL_SETUP_SCRIPT"

    - name: Run Tuffgal
      id: harness
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TUFFGAL_STORY: ${{ inputs.story }}
        TUFFGAL_HEADED: ${{ inputs.headed }}
        TUFFGAL_COVERAGE: ${{ inputs.coverage }}
      run: |
        set -euo pipefail
        args=(run --ci --manage-servers)
        if [ -n "$TUFFGAL_STORY" ]; then
          args+=(--story "$TUFFGAL_STORY")
        fi
        if [ "$TUFFGAL_HEADED" = "true" ]; then
          args+=(--headed)
        fi
        if [ "$TUFFGAL_COVERAGE" = "true" ]; then
          args+=(--coverage)
        fi
        npx tuffgal "${args[@]}"

    - name: Parse harness outcome
      id: outcome
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TUFFGAL_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail
        results="$TUFFGAL_REPORT_PATH/results.json"

        # Emit the no-results contract (zeroed counts + a no-results outcome) and
        # the step summary, leaving the step SUCCESSFUL so downstream always()
        # steps still see defined outputs. Shared by the missing-file and the
        # malformed-JSON branches below so both emit an identical block.
        emit_no_results() {
          {
            echo "passed=0"
            echo "changed=0"
            echo "failed=0"
            echo "new=0"
            echo "deleted=0"
            echo "total=0"
            echo "env-mismatch=false"
            echo "pending=false"
            echo "outcome=no-results"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Tuffgal"
            echo ""
            echo "The run wrote no \`results.json\` — check the Run Tuffgal step log and confirm \`report-path\` matches \`paths.report\` in tuffgal.config.ts. Treating as failed."
          } >> "$GITHUB_STEP_SUMMARY"
        }

        # No results file, or a file that isn't a valid JSON object (empty,
        # truncated, or otherwise malformed). Validate ONCE up front: without
        # this, the first `jq` below runs against garbage, spews a parse error,
        # and — with the later integer tests under `set -euo pipefail` — kills
        # the step mid-way, leaking unset outputs to the always() steps. Route
        # both cases to the same no-results contract and exit cleanly instead.
        if [ ! -f "$results" ] || ! jq -e 'type == "object"' "$results" >/dev/null 2>&1; then
          emit_no_results
          exit 0
        fi

        passed=$(jq -r '.totals.passed // 0' "$results")
        changed=$(jq -r '.totals.changed // 0' "$results")
        failed=$(jq -r '.totals.failed // 0' "$results")
        new=$(jq -r '.totals.new // 0' "$results")
        deleted=$(jq -r '.totals.deleted // 0' "$results")
        total=$(jq -r '.totals.stories // 0' "$results")
        env_mismatch=$(jq -r 'if .environment.mismatch == true then "true" else "false" end' "$results")

        if [ "$((new + changed + deleted))" -gt 0 ]; then
          pending=true
        else
          pending=false
        fi

        # Precedence mirrors tuffgal exit codes: failed (1) > env-mismatch (3) > pending (2) > pass.
        if [ "$failed" -gt 0 ]; then
          outcome="failed"
        elif [ "$env_mismatch" = "true" ]; then
          outcome="env-mismatch"
        elif [ "$pending" = "true" ]; then
          outcome="changed"
        else
          outcome="pass"
        fi

        {
          echo "passed=$passed"
          echo "changed=$changed"
          echo "failed=$failed"
          echo "new=$new"
          echo "deleted=$deleted"
          echo "total=$total"
          echo "env-mismatch=$env_mismatch"
          echo "pending=$pending"
          echo "outcome=$outcome"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Tuffgal"
          echo ""
          echo "Outcome: **$outcome**"
          if [ "$env_mismatch" = "true" ]; then
            echo ""
            echo "> ⚠️ **Capture environment changed** — the committed baselines were captured in a different environment than this CI run. Comparison still ran, but expect a full re-approve."
          fi
          echo ""
          echo "| Status | Count |"
          echo "|--------|-------|"
          echo "| Pass | $passed |"
          echo "| Changed | $changed |"
          echo "| New | $new |"
          echo "| Deleted | $deleted |"
          echo "| Failed | $failed |"
          echo "| Total | $total |"
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "Download the \`tuffgal-report\` artifact and open \`index.html\` for story-by-story diffs and traces."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Assemble candidates artifact
      if: always() && inputs.upload-artifacts == 'true' && steps.outcome.outputs.pending == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TUFFGAL_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail
        candidates="$TUFFGAL_REPORT_PATH/candidates"
        # The candidate tree is written by `tuffgal run --ci`; bundle a copy of
        # results.json alongside it so `tuffgal approve --from <dir> --prune` has
        # the deleted/environment records it needs without a second download.
        # Create the dir first so a deleted-only run (orphans pruned, no new
        # candidate PNGs written) still produces an artifact carrying the
        # deleted records the prune step depends on.
        mkdir -p "$candidates"
        cp "$TUFFGAL_REPORT_PATH/results.json" "$candidates/results.json"

    - name: Upload report
      if: always() && inputs.upload-artifacts == 'true' && (steps.outcome.outputs.failed != '0' || steps.outcome.outputs.pending == 'true' || steps.outcome.outputs.outcome == 'no-results')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tuffgal-report
        path: ${{ inputs.working-directory }}/${{ inputs.report-path }}/
        retention-days: ${{ inputs.retention-days }}

    - name: Upload candidates
      if: always() && inputs.upload-artifacts == 'true' && steps.outcome.outputs.pending == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tuffgal-candidates
        path: ${{ inputs.working-directory }}/${{ inputs.report-path }}/candidates/
        retention-days: ${{ inputs.retention-days }}

    # Publish a per-PR Pages preview so the comment can link straight to the
    # report + individual PNGs instead of a zip. The report references baselines
    # as `../baselines/…`, so both trees are staged as siblings under `pr-<n>/`
    # (report/ + baselines/) to keep those relative image srcs resolving exactly
    # as they do locally. Concurrent visual runs on DIFFERENT PRs share this one
    # branch; each replaces only its own `pr-<n>/` subtree, so a second push
    # rejected non-fast-forward just needs the advanced tip re-synced and this
    # PR's (idempotent) subtree re-applied — the push is retried a couple of
    # times before falling back. Best-effort: a recognized not-configured state
    # (no contents:write, Pages off, private repo) logs a notice, while an
    # unexpected git/API failure logs a warning; either way preview-url is left
    # empty and the comment falls back to artifact-download links. The push
    # token is masked (core.setSecret) and redacted from error logs so a custom
    # pages-token can't leak in cleartext. Never fails the job.
    - name: Publish per-PR preview to GitHub Pages
      id: pages
      if: always() && github.event_name == 'pull_request' && inputs.pages-preview == 'true' && steps.outcome.outputs.pending == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        TUFFGAL_REPORT_PATH: ${{ inputs.report-path }}
        TUFFGAL_BASELINES_PATH: ${{ inputs.baselines-path }}
        TUFFGAL_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PAGES_BRANCH: ${{ inputs.pages-branch }}
        GIT_USER_NAME: tuffgal[bot]
        GIT_USER_EMAIL: tuffgal-bot@users.noreply.github.com
        # Same token authenticates the git push and the Pages API calls below.
        # Defaults to GITHUB_TOKEN (pushes fine, cannot create the Pages site);
        # a PAT/App token with admin lets createPagesSite auto-enable Pages.
        GITHUB_TOKEN: ${{ inputs.pages-token }}
        # This composite's own action dir. `github.action_path` is only supported
        # in composite actions and is evaluated HERE in the composite's context;
        # it is NOT the same as `GITHUB_ACTION_PATH` inside the nested github-
        # script step below, which points at github-script's own action dir. The
        # script requires the push-retry decision from this path. (Source-locked
        # by ci.yml pages-push-require-source-lock.)
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.pages-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const { owner, repo } = context.repo;
          const prNumber = context.payload.pull_request.number;

          const wd = process.env.TUFFGAL_WORKING_DIRECTORY || '.';
          const reportAbs = path.resolve(wd, process.env.TUFFGAL_REPORT_PATH || 'tuffgal/report');
          const baselinesAbs = path.resolve(wd, process.env.TUFFGAL_BASELINES_PATH || 'tuffgal/baselines');
          const branch = process.env.PAGES_BRANCH || 'gh-pages';

          const run = (cmd, args, opts) =>
            execFileSync(cmd, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], ...opts });
          const token = process.env.GITHUB_TOKEN;
          // Register the push token with the runner's log masking. GITHUB_TOKEN
          // is auto-masked, but a custom pages-token from a non-secret path is
          // not — without this it (and the credentialed remote below) would
          // print in cleartext on any git failure, since an execFileSync error
          // message carries the full argv. redact() is a second guard for any
          // surface that bypasses masking.
          if (token) core.setSecret(token);
          const redact = (value) => (token ? String(value).split(token).join('***') : String(value));
          const remote = `https://x-access-token:${token}@github.com/${owner}/${repo}.git`;
          const work = path.join(process.env.RUNNER_TEMP, 'tuffgal-pages');

          const prDir = path.join(work, `pr-${prNumber}`);

          // Build a fresh local clone of the preview branch: shallow-clone the
          // existing branch, or start an orphan for the first-ever preview. Run
          // again on a retry so a push that raced a concurrent PR re-clones the
          // now-existing branch (the race advanced its tip) instead of re-orphaning.
          const syncClone = () => {
            fs.rmSync(work, { recursive: true, force: true });
            fs.mkdirSync(work, { recursive: true });
            try {
              run('git', ['clone', '--depth', '1', '--branch', branch, remote, work]);
            } catch {
              run('git', ['init', '-q', work]);
              run('git', ['-C', work, 'remote', 'add', 'origin', remote]);
              run('git', ['-C', work, 'checkout', '-q', '--orphan', branch]);
            }
            run('git', ['-C', work, 'config', 'user.name', process.env.GIT_USER_NAME]);
            run('git', ['-C', work, 'config', 'user.email', process.env.GIT_USER_EMAIL]);
          };

          // Replace only THIS PR's subtree; other PRs' previews are untouched.
          // report/ + baselines/ stage as siblings so the report's
          // `../baselines/…` image srcs resolve on Pages as they do locally. The
          // op is idempotent, so re-applying it onto a freshly re-synced tip is
          // safe on a retry.
          const applySubtree = () => {
            fs.rmSync(prDir, { recursive: true, force: true });
            fs.mkdirSync(path.join(prDir, 'report'), { recursive: true });
            fs.cpSync(reportAbs, path.join(prDir, 'report'), { recursive: true });
            if (fs.existsSync(baselinesAbs)) {
              fs.cpSync(baselinesAbs, path.join(prDir, 'baselines'), { recursive: true });
            }
            run('git', ['-C', work, 'add', '-A']);
            // `git commit` exits non-zero when nothing changed; treat as a no-op.
            try {
              run('git', ['-C', work, 'commit', '-q', '-m', `tuffgal preview for PR #${prNumber}`]);
            } catch (e) {
              if (!/nothing to commit/.test(String((e && e.stdout) || '') + String((e && e.stderr) || ''))) throw e;
            }
          };

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          // 1. Publish this PR's subtree to the pages branch FIRST. The branch
          //    must exist before Pages can be pointed at it — resolving/enabling
          //    Pages before the push would deadlock a fresh repo (you cannot
          //    select a source branch that does not exist yet).
          //
          //    Two visual runs on different PRs share this branch, so a push can
          //    be rejected non-fast-forward even though the two subtrees are
          //    disjoint; re-sync the advanced tip, re-apply this PR's subtree,
          //    and retry a few times. A terminal failure (no contents:write) or
          //    an exhausted retry aborts with an empty preview-url, so the
          //    comment falls back to artifact links.
          //
          //    Declared out here so it survives into the fallback catch: a
          //    recognized access gap (no contents:write) is an expected
          //    not-configured state the catch logs as a notice, while an
          //    unexpected git failure (or a module-load failure, which leaves
          //    this false) stays a surprising warning.
          let pushFailureExpected = false;
          try {
            // The PURE retryable-vs-terminal push classifier lives in a committed,
            // unit-tested module (scripts/pages-push.js + the scripts-unit
            // CI job); only the git side effects stay inline here. Required INSIDE
            // this never-fail block so even a module-load failure degrades to the
            // artifact-link fallback rather than failing the step.
            const { isRetryablePushError, isExpectedPushFailure } = require(`${process.env.ACTION_PATH}/scripts/pages-push.js`);
            const maxAttempts = 3;
            for (let attempt = 1; ; attempt++) {
              syncClone();
              applySubtree();
              try {
                run('git', ['-C', work, 'push', '-q', 'origin', `HEAD:refs/heads/${branch}`]);
                break;
              } catch (error) {
                const detail =
                  String((error && error.stdout) || '') + String((error && error.stderr) || '') + String((error && error.message) || '');
                // A non-fast-forward means a concurrent PR advanced the shared
                // tip — re-sync and re-apply. A permission failure never recovers.
                if (attempt >= maxAttempts || !isRetryablePushError(detail)) {
                  // A recognized access gap (no contents:write, protected
                  // branch, bad credential) is an expected not-configured
                  // state → the fallback catch logs a notice. An unrecognized
                  // git failure, or an exhausted concurrent-PR race, stays a
                  // surprising warning.
                  pushFailureExpected = isExpectedPushFailure(detail);
                  throw error;
                }
                core.info(`Pages preview push rejected (attempt ${attempt}/${maxAttempts}); re-syncing the ${branch} tip and retrying.`);
                await sleep(attempt * 500);
              }
            }
          } catch (e) {
            const detail = redact(e.message);
            if (pushFailureExpected) {
              core.notice(`Skipping the per-PR Pages preview — the job needs \`contents: write\` (or a valid \`pages-token\`) to push the ${branch} branch: ${detail}. The comment falls back to artifact-download links.`);
            } else {
              core.warning(`Could not push the per-PR Pages preview (unexpected git failure): ${detail}. The comment falls back to artifact-download links.`);
            }
            core.setOutput('preview-url', '');
            return;
          }

          // 2. Resolve the canonical Pages base URL (handles project vs user/org
          //    pages and custom domains). If Pages is not yet enabled, try to
          //    enable it against the branch we just pushed. Site CREATION needs a
          //    repo-admin credential: the default GITHUB_TOKEN can push but
          //    cannot create the site (403), so auto-enable only works when
          //    `pages-token` is a PAT/App token with admin. Either failure leaves
          //    preview-url empty — the branch is still pushed, so enabling Pages
          //    by hand later makes past previews resolve.
          let baseUrl = '';
          const readBase = async () => {
            const pages = await github.rest.repos.getPages({ owner, repo });
            return (pages.data.html_url || '').replace(/\/$/, '');
          };
          try {
            baseUrl = await readBase();
          } catch (e) {
            try {
              await github.rest.repos.createPagesSite({ owner, repo, source: { branch, path: '/' } });
              core.info(`Enabled GitHub Pages for ${owner}/${repo} (source: ${branch}).`);
              baseUrl = await readBase();
            } catch (e2) {
              // A 403/404 is the expected not-configured state: the default
              // GITHUB_TOKEN cannot create the site, or Pages is simply off.
              // Log a notice. Any other status is a surprising API failure and
              // stays a warning.
              const expected = e2.status === 403 || e2.status === 404;
              const hint = expected
                ? `The default GITHUB_TOKEN cannot create a Pages site. Either enable Pages once by hand (Settings → Pages → source: the ${branch} branch), or pass an admin PAT/App token via the \`pages-token\` input to auto-enable it.`
                : `Enable Pages (source: the ${branch} branch) to get deep-link previews.`;
              const message = `GitHub Pages is not enabled and could not be enabled automatically (${e2.status || e2.message}); the branch was pushed. ${hint} Falling back to artifact links.`;
              if (expected) core.notice(message);
              else core.warning(message);
              core.setOutput('preview-url', '');
              return;
            }
          }
          if (!baseUrl) {
            core.warning('Could not resolve the Pages base URL; falling back to artifact links.');
            core.setOutput('preview-url', '');
            return;
          }

          const previewUrl = `${baseUrl}/pr-${prNumber}`;
          core.setOutput('preview-url', previewUrl);
          core.info(`Published per-PR preview to ${previewUrl}/report/index.html (Pages may take a moment to build).`);

    - name: Post sticky PR comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        # Pass the COMPOSITE's action path through the step env: inside this
        # nested github-script step GITHUB_ACTION_PATH points at github-script's
        # own dir, not ours, so the module require below reads ACTION_PATH.
        ACTION_PATH: ${{ github.action_path }}
        TUFFGAL_REPORT_PATH: ${{ inputs.report-path }}
        TUFFGAL_BASELINES_PATH: ${{ inputs.baselines-path }}
        PREVIEW_URL: ${{ steps.pages.outputs.preview-url }}
        TUFFGAL_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        OUTCOME: ${{ steps.outcome.outputs.outcome }}
        PASSED: ${{ steps.outcome.outputs.passed }}
        CHANGED: ${{ steps.outcome.outputs.changed }}
        NEW: ${{ steps.outcome.outputs.new }}
        DELETED: ${{ steps.outcome.outputs.deleted }}
        FAILED: ${{ steps.outcome.outputs.failed }}
        TOTAL: ${{ steps.outcome.outputs.total }}
        ENV_MISMATCH: ${{ steps.outcome.outputs.env-mismatch }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          // Nested github-script step: require via the composite's ACTION_PATH
          // (passed through this step's env above), never bare GITHUB_ACTION_PATH.
          const { MARKER, buildCommentBody } = require(`${process.env.ACTION_PATH}/scripts/build-comment.js`);

          const wd = process.env.TUFFGAL_WORKING_DIRECTORY || '.';
          const reportPath = process.env.TUFFGAL_REPORT_PATH || 'tuffgal/report';
          const resultsFile = path.join(wd, reportPath, 'results.json');

          const outcome = process.env.OUTCOME || 'no-results';
          const counts = {
            passed: process.env.PASSED || '0',
            changed: process.env.CHANGED || '0',
            new: process.env.NEW || '0',
            deleted: process.env.DELETED || '0',
            failed: process.env.FAILED || '0',
            total: process.env.TOTAL || '0',
          };
          const envMismatch = process.env.ENV_MISMATCH === 'true';

          // A published preview turns every image path + story into a real URL.
          // Empty when pages-preview is off or publishing failed → the comment
          // degrades to the plain name list + artifact-download flow below.
          const previewUrl = (process.env.PREVIEW_URL || '').replace(/\/$/, '');
          const baselinesPath = process.env.TUFFGAL_BASELINES_PATH || 'tuffgal/baselines';
          const reportAbs = path.resolve(wd, reportPath);
          const baselinesAbs = path.resolve(wd, baselinesPath);
          // Map an absolute results.json image path to its preview URL. The
          // preview stages report-path under `pr-<n>/report` and baselines-path
          // under `pr-<n>/baselines`, so relativize against whichever root the
          // path lives under. Returns null for a path under neither (or no
          // preview), so callers just skip that image.
          const toPreviewUrl = (abs) => {
            if (!previewUrl || !abs) return null;
            const r = path.resolve(abs);
            const under = (root) => r === root || r.startsWith(root + path.sep);
            if (under(reportAbs)) return `${previewUrl}/report/${path.relative(reportAbs, r).split(path.sep).join('/')}`;
            if (under(baselinesAbs)) return `${previewUrl}/baselines/${path.relative(baselinesAbs, r).split(path.sep).join('/')}`;
            return null;
          };

          // Story names + per-story image URLs are a best-effort convenience read
          // from results.json; the counts above (from the parse step) are the
          // authoritative source. `index` is the story's position in the stories
          // array — the SAME ordinal template.ts renders as `id="story-<index>"`,
          // so `#story-<index>` deep-links land on the right story.
          let changed = [], added = [], deletedNames = [], mismatchKeys = [];
          try {
            const r = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
            (r.stories || []).forEach((s, index) => {
              const actions = s.actions || [];
              const statuses = [s.status].concat(actions.map(a => a.status));
              // One representative shot per story for the inline preview: the
              // first action that actually drifted (or the story's first action).
              const shotFrom = (want) => actions.find(a => a.status === want) || actions[0] || {};
              const name = String(s.story || s.file || `story ${index}`).replace(/[\r\n]+/g, ' ');
              if (statuses.includes('new')) {
                const a = shotFrom('new');
                added.push({ index, name, actual: toPreviewUrl(a.actualPath) });
              } else if (statuses.includes('changed')) {
                const a = shotFrom('changed');
                changed.push({
                  index, name,
                  baseline: toPreviewUrl(a.baselinePath),
                  actual: toPreviewUrl(a.actualPath),
                  diff: toPreviewUrl(a.diffPath),
                });
              }
            });
            deletedNames = (r.deleted || []).map(d =>
              typeof d === 'string' ? d : (d.action || d.story || d.path || JSON.stringify(d)));
            mismatchKeys = (r.environment && r.environment.mismatchKeys) || [];
          } catch (e) {
            core.info(`Could not read story names from results.json: ${e.message}`);
          }

          const { owner, repo } = context.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

          // The pure body build — sections, thumbnails, env-mismatch banner,
          // totals table, approve CTA, and outcome fallbacks all live in the
          // module so the branch matrix is unit-tested.
          const body = buildCommentBody({
            outcome, counts, envMismatch, mismatchKeys, previewUrl,
            changed, added, deletedNames, runUrl,
          });
          const issue_number = context.payload.pull_request.number;

          // Posting the comment must never fail the job — a missing
          // `pull-requests: write` permission degrades to a warning; the run's
          // real outcome is already carried by the job status + step summary.
          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (e) {
            core.warning(`Could not post the sticky comment (is 'permissions: pull-requests: write' set?): ${e.message}`);
          }

    - name: Surface harness exit code
      if: always() && (steps.outcome.outputs.outcome == 'failed' || steps.outcome.outputs.outcome == 'no-results' || steps.outcome.outputs.outcome == 'env-mismatch' || (inputs.fail-on-changed == 'true' && steps.outcome.outputs.outcome == 'changed'))
      shell: bash
      run: exit 1
