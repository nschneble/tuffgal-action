# Copy this into your consumer repo at .github/workflows/tuffgal-approve.yml
# It lets maintainers approve Tuffgal candidate baselines two ways:
#   - tick a checkbox in the bot's PR comment — the master "Approve these
#     baselines" box for all, or a per-story box to approve just that one — or
#   - comment `@tuffgal approve` on the pull request.
# Either way the bot verifies the approver has write access, downloads the
# tuffgal-candidates artifact from the PR's latest run, and commits the approved
# baselines to the PR head branch.
#
# Fork PRs: the default token cannot push to fork branches, so fork
# contributors approve locally instead — download the tuffgal-candidates
# artifact and run `npx tuffgal approve --from <dir> --prune`, then commit.
name: tuffgal-approve

on:
  issue_comment:
    # `created` catches the `@tuffgal approve` mention; `edited` catches a ticked
    # approve checkbox in the bot's sticky report comment.
    types: [created, edited]

jobs:
  approve:
    # Cheap pre-filter; the action re-validates the trigger and the approver's
    # permission before doing anything. Two shapes: the mention, or an edited
    # report comment with a ticked box — the master approve box, or one of the
    # per-story item boxes for a partial approve. The `[x]` + marker pair keeps
    # an unrelated ticked task list from triggering.
    if: >-
      github.event.issue.pull_request && (
        contains(github.event.comment.body, '@tuffgal approve') ||
        (github.event.action == 'edited' &&
         contains(github.event.comment.body, 'tuffgal-approve-box') &&
         (contains(github.event.comment.body, '[x] <!-- tuffgal-approve-box') ||
          contains(github.event.comment.body, '[X] <!-- tuffgal-approve-box') ||
          contains(github.event.comment.body, '[x] <!-- tuffgal-approve-item:') ||
          contains(github.event.comment.body, '[X] <!-- tuffgal-approve-item:')))
      )
    runs-on: ubuntu-latest
    # Serialize approvals per PR. A second trigger — another maintainer's tick, or
    # a `@tuffgal approve` typed while one is running — queues behind the approval
    # in flight instead of racing it to the same branch. Never cancel in progress:
    # a run killed between the baseline commit and its final comment update would
    # leave the sticky comment stranded on a progress banner. The action also locks
    # its own checkboxes while running, but this group is the real serializer.
    concurrency:
      group: tuffgal-approve-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write # commit baselines to the PR head branch
      pull-requests: write # react + reply on the comment
      actions: read # download the candidates artifact from the PR run
      checks: write # synthesize the passing required check on a full-clear approve (only if you set check-name)
    steps:
      - uses: nschneble/tuffgal-action/approve@v1
        with:
          working-directory: .
          # artifact-name: tuffgal-candidates # set a unique name per visual job for matrix / smoke suites
          # baselines-path: tuffgal/baselines
          # check-name: tuffgal # required-check name(s) to mark passing on a full-clear approve (comma-separate per job); needs checks: write
          # git-user-email: tuffgal-bot@users.noreply.github.com
          # git-user-name: tuffgal[bot]
          # node-version: "22"
          # token: ${{ secrets.TUFFGAL_APPROVE_TOKEN }}
