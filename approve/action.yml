name: Tuffgal Approve
description: >-
  Commit CI-produced candidate baselines to a PR head branch in response to a
  `@tuffgal approve` comment. Verifies commenter permission, downloads the
  candidates artifact from the PR's latest run, applies it via
  `tuffgal approve --from`, and commits ONLY the baselines directory as a bot.
  Never checks out or executes PR-branch code. By default the commit is made
  with `GITHUB_TOKEN`, which does not retrigger the consumer's visual workflow
  (GitHub's recursion prevention); pass a PAT / GitHub App token via `token`
  to have the check re-run automatically.
author: Nick Schneble
branding:
  icon: check-circle
  color: purple

inputs:
  baselines-path:
    description: Path to the baselines directory (must match `paths.baselines` in tuffgal.config.ts). Commits are strictly scoped to this directory.
    required: false
    default: "tuffgal/baselines"
  artifact-name:
    description: Name of the candidates artifact to promote. Consumers with multiple visual jobs per run (matrix / smoke suites) set a unique name per job so approve knows which candidate set to promote; a run carrying more than one artifact with this name fails closed.
    required: false
    default: "tuffgal-candidates"
  node-version:
    description: Node.js version for setup-node. Tuffgal requires Node 22+.
    required: false
    default: "22"
  working-directory:
    description: Directory containing tuffgal.config.ts and package.json.
    required: false
    default: "."
  git-user-name:
    description: Name used for the baseline commit author/committer.
    required: false
    default: "tuffgal[bot]"
  git-user-email:
    description: Email used for the baseline commit author/committer.
    required: false
    default: "tuffgal-bot@users.noreply.github.com"
  token:
    description: Token for the baseline commit and updateRef. Defaults to `GITHUB_TOKEN`, which will not retrigger the visual check (GitHub's recursion prevention); supply a PAT or GitHub App installation token to have it re-run automatically. See the README approve section for the trade-off.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # ------------------------------------------------------------------ #
    # 1. Permission gate + PR resolution. Runs BEFORE any checkout,       #
    #    download, or write. Fails closed: unauthorized commenters get a  #
    #    👀 reaction and nothing else; fork PRs are declined with a note. #
    #    The comment body is only ever read in JS and compared — it is    #
    #    never interpolated into a shell command.                         #
    # ------------------------------------------------------------------ #
    - name: Gate on permission + resolve PR
      id: gate
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        # This composite's own action dir, evaluated in the composite context (see
        # the commit step's ACTION_PATH note). The script requires resolve-approver.js
        # from here — NOT via GITHUB_ACTION_PATH, which inside a nested github-script
        # step points at github-script's own dir.
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const comment = context.payload.comment;
          const issue = context.payload.issue;

          // Defense in depth: re-validate the trigger even though the calling
          // workflow already filtered. The body never reaches a shell.
          //
          // The PURE trigger/actor decision — which of the two approve shapes
          // fired (mention vs. ticked checkbox), who the approver is, and the
          // fail-closed early-outs (not a PR, neither trigger, bot-authored edit)
          // — lives in a committed, unit-tested module. The API-bound pieces
          // (reaction, permission lookup, fork decline) stay inline below. See
          // resolve-approver.js and the approve-scripts-unit CI job.
          const { resolveApprover } = require(`${process.env.ACTION_PATH}/scripts/resolve-approver.js`);
          const { proceed, actor, reason } = resolveApprover({
            eventName: context.eventName,
            action: context.payload.action,
            comment,
            issue,
            contextActor: context.actor,
          });

          if (!proceed) {
            // 'ignored-actor' is a bot-authored edit (e.g. the visual workflow
            // refreshing the sticky comment) or a missing actor — never react on
            // it. 'no-trigger' is a non-PR comment or neither approve shape.
            core.info(reason === 'ignored-actor'
              ? `Ignoring edit by '${actor}'.`
              : 'Comment is not a @tuffgal approve or a ticked approve box on a PR; nothing to do.');
            core.setOutput('proceed', 'false');
            return;
          }

          const react = async (content) => {
            try {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: comment.id, content,
              });
            } catch (e) { core.info(`Could not add reaction: ${e.message}`); }
          };

          // Verify the approver's repository permission BEFORE any download or
          // write. Require admin / maintain / write. Fail closed on anything else
          // (including API errors).
          let level = 'none';
          try {
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: actor,
            });
            level = perm.data.permission; // 'admin' | 'maintain' | 'write' | 'read' | 'none'
          } catch (e) {
            core.warning(`Permission lookup failed for ${actor}: ${e.message}`);
          }
          const allowed = ['admin', 'maintain', 'write'];
          if (!allowed.includes(level)) {
            core.warning(`${actor} has '${level}' permission; approval requires write or higher.`);
            await react('eyes');
            core.setOutput('proceed', 'false');
            return;
          }

          // Resolve the PR head. Fork PRs cannot be pushed to with the default
          // token — decline with a note pointing at the implicit approve path.
          const pr = await github.rest.pulls.get({ owner, repo, pull_number: issue.number });
          const headRepo = pr.data.head.repo ? pr.data.head.repo.full_name : null;
          const baseRepo = `${owner}/${repo}`;
          if (headRepo !== baseRepo) {
            await react('eyes');
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                '<!-- tuffgal-approve -->',
                '🍴 This PR is from a fork, so the bot cannot push baselines to its branch with the default token.',
                '',
                'Approve from a local checkout instead: download the `tuffgal-candidates` artifact from the latest run and run',
                '`npx tuffgal approve --from <extracted-dir> --prune`, then commit the updated baselines directory to your fork branch.',
              ].join('\n'),
            });
            core.setOutput('proceed', 'false');
            return;
          }

          // provides an immediate acknowledgement
          await react('eyes');

          core.setOutput('proceed', 'true');
          core.setOutput('pr_number', String(issue.number));
          core.setOutput('comment_id', String(comment.id));
          core.setOutput('head_ref', pr.data.head.ref);
          core.setOutput('head_sha', pr.data.head.sha);

    # ------------------------------------------------------------------ #
    # 2. Check out the BASE repository's DEFAULT branch — trusted code    #
    #    only. The PR head branch is never checked out or executed; it is #
    #    used solely as a commit target (via the git data API) and as a   #
    #    data-only source for its current baselines.                      #
    # ------------------------------------------------------------------ #
    - name: Checkout default branch (trusted)
      if: steps.gate.outputs.proceed == 'true'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 1

    - name: Set up Node.js
      if: steps.gate.outputs.proceed == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies (trusted base deps)
      if: steps.gate.outputs.proceed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    # ------------------------------------------------------------------ #
    # 3. Download the tuffgal-candidates artifact from the latest         #
    #    completed run for the PR head SHA. Written to $RUNNER_TEMP,      #
    #    outside the checkout, so it can never overwrite repo files.      #
    # ------------------------------------------------------------------ #
    - name: Download candidates artifact
      id: download
      if: steps.gate.outputs.proceed == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        # This composite's own action dir (see the commit step's ACTION_PATH note).
        # The script requires select-candidate.js from here.
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const { owner, repo } = context.repo;
          const headSha = process.env.HEAD_SHA;
          const artifactName = process.env.ARTIFACT_NAME;

          // The PURE selection decision — newest-run-first ordering and the
          // per-run match classification (single → select, >1 → fail closed
          // ambiguous, 0 → none) — lives in a committed, unit-tested module. The
          // `github.paginate` fetches and the createComment / setFailed side
          // effects stay inline; the run-by-run fetch below stays LAZY, stopping
          // at the first run with a match. See select-candidate.js.
          const { sortRunsNewestFirst, classifyMatches } =
            require(`${process.env.ACTION_PATH}/scripts/select-candidate.js`);

          // Newest completed run for this head SHA that carries the artifact.
          const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
            owner, repo, head_sha: headSha, status: 'completed', per_page: 100,
          });
          const runsNewestFirst = sortRunsNewestFirst(runs);

          // Iterate newest-first; the first run carrying at least one match is
          // the selected run. Ambiguity WITHIN that run (a matrix / smoke suite
          // that uploads multiple same-named artifacts) is an error, not a
          // coin flip: fail closed rather than promote an arbitrary set.
          let artifact = null;
          for (const run of runsNewestFirst) {
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const result = classifyMatches(arts, artifactName);
            if (result.kind === 'none') continue;
            if (result.kind === 'ambiguous') {
              const guidance = [
                `Run ${run.id} carries ${result.count} artifacts named \`${artifactName}\`, so promoting one would be arbitrary.`,
                'Set a unique `artifact-name` per visual job (matrix / smoke suites), or run a single visual job per workflow, then re-comment `@tuffgal approve`.',
              ];
              await github.rest.issues.createComment({
                owner, repo, issue_number: Number(process.env.PR_NUMBER),
                body: ['<!-- tuffgal-approve -->', `⚠️ ${guidance[0]}`, '', guidance[1]].join('\n'),
              });
              core.setFailed(guidance.join(' '));
              return;
            }
            artifact = result.artifact;
            break;
          }
          if (!artifact) {
            core.setOutput('found', 'false');
            core.warning(`No ${artifactName} artifact found for ${headSha}.`);
            return;
          }

          const zip = await github.rest.actions.downloadArtifact({
            owner, repo, artifact_id: artifact.id, archive_format: 'zip',
          });
          const dir = path.join(process.env.RUNNER_TEMP, 'tuffgal-candidates');
          fs.mkdirSync(dir, { recursive: true });
          const zipPath = path.join(process.env.RUNNER_TEMP, 'tuffgal-candidates.zip');
          fs.writeFileSync(zipPath, Buffer.from(zip.data));
          core.setOutput('found', 'true');
          core.setOutput('zip_path', zipPath);
          core.setOutput('dir', dir);

    - name: No candidates found
      if: steps.gate.outputs.proceed == 'true' && steps.download.outputs.found != 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
      with:
        script: |
          const { owner, repo } = context.repo;
          await github.rest.issues.createComment({
            owner, repo, issue_number: Number(process.env.PR_NUMBER),
            body: '<!-- tuffgal-approve -->\n⚠️ No `tuffgal-candidates` artifact was found for the latest run of this PR. Re-run the visual regression job, then comment `@tuffgal approve` again.',
          });

    # ------------------------------------------------------------------ #
    # 4. Validate the artifact BEFORE extraction (fail closed). Every zip #
    #    entry must be a relative path with no traversal and an allowed   #
    #    extension. Any violation aborts the job.                         #
    # ------------------------------------------------------------------ #
    - name: Validate + extract candidates
      id: extract
      if: steps.gate.outputs.proceed == 'true' && steps.download.outputs.found == 'true'
      shell: bash
      env:
        ZIP_PATH: ${{ steps.download.outputs.zip_path }}
        CAND_DIR: ${{ steps.download.outputs.dir }}
      run: |
        set -euo pipefail

        # Validate every zip entry (allowlist, no traversal) BEFORE extracting.
        # Fails closed on any violation. Logic lives in a standalone, unit-tested
        # script.
        bash "$GITHUB_ACTION_PATH/validate-artifact.sh" "$ZIP_PATH"

        rm -rf "$CAND_DIR"
        mkdir -p "$CAND_DIR"
        unzip -qq -o "$ZIP_PATH" -d "$CAND_DIR"
        echo "cand_dir=$CAND_DIR" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------ #
    # 5. Preflight the trusted default-branch CLI for `approve --from`    #
    #    support BEFORE we invoke it. A tuffgal older than                #
    #    `0.2.0-alpha.1` has no `--from`, silently falls through to a     #
    #    plain `approve`, and dies with a cryptic "no prior run" error.   #
    #    We probe the CLI's own help text for the flag (robust across     #
    #    prerelease version ordering) and, if it's missing, post a        #
    #    pointed comment and fail. Gated identically to the apply step so #
    #    a stale-tuffgal repo with NO candidates still gets the           #
    #    friendlier "No candidates found" path, not this.                 #
    # ------------------------------------------------------------------ #
    - name: Preflight tuffgal supports approve --from
      if: steps.gate.outputs.proceed == 'true' && steps.download.outputs.found == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        WORKDIR: ${{ inputs.working-directory }}
        PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
      with:
        script: |
          const { execFileSync } = require('child_process');
          const { owner, repo } = context.repo;

          // Probe the ACTUAL CLI surface, not a version string. `tuffgal help`
          // prints its full usage (and returns before loading any config), so a
          // build that supports `approve --from` lists the flag and a build
          // predating `0.2.0-alpha.1` does not. This dodges the
          // prerelease-ordering trap where a naive semver string compare
          // ranks `-alpha.10` below `-alpha.2`.
          // Runs the same trusted base deps `npm ci` installed and the apply
          // step invokes — no head-branch code is executed.
          let help = '';
          try {
            help = execFileSync('npx', ['tuffgal', 'help'], {
              cwd: process.env.WORKDIR || '.',
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
          } catch (e) {
            // A crashed/absent CLI can't prove support; fall through to fail.
            help = String((e && e.stdout) || '');
            core.warning(`Could not read tuffgal help output: ${e.message}`);
          }

          if (help.includes('--from')) {
            core.info('Installed tuffgal supports `approve --from`; proceeding.');
            return;
          }

          await github.rest.issues.createComment({
            owner, repo, issue_number: Number(process.env.PR_NUMBER),
            body: [
              '<!-- tuffgal-approve -->',
              '🧭 The tuffgal pinned on this repo\'s default branch predates `approve --from`, so the bot can\'t promote candidate baselines from here.',
              '',
              'Land the tuffgal dependency bump (`>= 0.2.0-alpha.1`) on the default branch, then comment `@tuffgal approve` again.',
            ].join('\n'),
          });
          core.setFailed('Installed tuffgal does not support `approve --from`; bump tuffgal on the default branch.');

    # ------------------------------------------------------------------ #
    # 6. Seed the baselines directory from the PR head (DATA ONLY — no    #
    #    code is checked out or run) so prune operates against the head's #
    #    committed set, then apply the candidates via the CLI. The CLI    #
    #    owns the tree copy, prune, and manifest write.                   #
    # ------------------------------------------------------------------ #
    - name: Apply candidates via tuffgal approve
      if: steps.gate.outputs.proceed == 'true' && steps.download.outputs.found == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CAND_DIR: ${{ steps.extract.outputs.cand_dir }}
        BASELINES_PATH: ${{ inputs.baselines-path }}
        HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
      run: |
        set -euo pipefail

        # Fetch the head commit as data and materialize ONLY the baselines
        # directory from it. `git archive` extracts tracked files without
        # checking out the working tree or running any repo code.
        git fetch --no-tags --depth=1 origin "$HEAD_SHA"
        rm -rf "$BASELINES_PATH"
        mkdir -p "$BASELINES_PATH"
        # BASELINES_PATH is working-directory-relative (this step runs with
        # working-directory: inputs.working-directory). git's `<rev>:<path>`
        # syntax is repo-root-relative and ignores cwd, so the leading `./` is
        # load-bearing: it makes the guard cwd-relative to match the (already
        # cwd-relative) `git archive` pathspec below. Without it a subdir
        # consumer's guard is always FALSE, the head baselines are never seeded,
        # and the downstream prune deletes every unchanged baseline. Locked by
        # ci.yml `approve-subdir-frame`.
        if git cat-file -e "$HEAD_SHA:./$BASELINES_PATH" 2>/dev/null; then
          git archive "$HEAD_SHA" -- "$BASELINES_PATH" | tar -x
        fi

        # Belt-and-suspenders symlink refusal. The head tree is UNTRUSTED (a
        # write collaborator controls its committed contents) and the extraction
        # above faithfully recreates any symlink committed under baselines. The
        # downstream commit step reads each file's bytes to blob them, so a
        # symlink pointing at a secret (../../.npmrc, /proc/self/environ) would
        # exfiltrate the target onto the PR branch. Refuse fail-closed the moment
        # the tree is materialized, before the CLI runs — mirrors
        # validate-artifact.sh pass 1 for the sibling untrusted input. The
        # commit step's walk() enforces the same invariant in Node; this is the
        # earlier, independent layer. (Locked by ci.yml approve-symlink-backstop.)
        seeded_links="$(find "$BASELINES_PATH" -type l)"
        if [ -n "$seeded_links" ]; then
          echo "Refusing symlink in seeded baselines: $seeded_links" >&2
          exit 1
        fi

        # CLI owns baseline promotion, prune, and manifest.json.
        npx tuffgal approve --from "$CAND_DIR" --prune

    # ------------------------------------------------------------------ #
    # 7. Commit ONLY the baselines directory onto the PR head branch via  #
    #    the git data API. Parent is the head SHA; the head branch is     #
    #    never checked out. Paths are scoped to baselines-path.           #
    #                                                                     #
    #    The commit, updateRef, reaction, and success comment all use the #
    #    `token` input (default `GITHUB_TOKEN`). A push made with          #
    #    `GITHUB_TOKEN` will NOT retrigger the consumer's visual workflow  #
    #    (GitHub's recursion prevention), so the success comment tells the #
    #    maintainer how to kick it; supplying a PAT / App token makes the  #
    #    check re-run automatically. TOKEN_IS_DEFAULT carries that fact    #
    #    into the script without exposing the token value.                #
    # ------------------------------------------------------------------ #
    - name: Commit baselines to PR head branch
      if: steps.gate.outputs.proceed == 'true' && steps.download.outputs.found == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        WORKDIR: ${{ inputs.working-directory }}
        BASELINES_PATH: ${{ inputs.baselines-path }}
        HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        COMMENT_ID: ${{ steps.gate.outputs.comment_id }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        # 'true'/'false' string from a GitHub-expression comparison; the token
        # value itself never reaches the environment or the logs.
        TOKEN_IS_DEFAULT: ${{ inputs.token == github.token }}
        # This composite's own action dir. `github.action_path` is only supported
        # in composite actions and is evaluated HERE in the composite's context;
        # it is NOT the same as `GITHUB_ACTION_PATH` inside the nested github-
        # script step below, which points at github-script's own action dir.
        # The script requires baseline-tree.js from this path. (Source-locked by
        # ci.yml approve-require-source-lock.)
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const { owner, repo } = context.repo;

          // The PURE, security-sensitive logic — the out-of-scope/traversal path
          // `guard`, the recursive file `walk`, the `toRepoPath` frame re-anchor,
          // and the `computeDeletions` (atHead \ onDisk) set-difference — lives in
          // a committed, unit-tested module. The thin GitHub git-data API calls
          // (createBlob / createTree / createCommit / updateRef) and the
          // `git ls-tree` below stay inline. See the module header and the
          // `approve-scripts-unit` CI job.
          const { walk, toRepoPath, computeDeletions, deriveFrames, BaselineScopeError } =
            require(`${process.env.ACTION_PATH}/scripts/baseline-tree.js`);

          const workdir = process.env.WORKDIR || '.';
          const baselinesRel = process.env.BASELINES_PATH;              // working-directory-relative (matches the input contract)
          const baselinesAbs = path.join(workdir, baselinesRel);
          const headRef = process.env.HEAD_REF;
          const headSha = process.env.HEAD_SHA;

          // Baselines prefix in two frames: repo-root-relative (for tree entries
          // and the guard) and working-directory-relative (for git pathspecs,
          // which git resolves against the process cwd). Derived + unit-tested in
          // the module so the '.', subdir, and trailing-slash cases are locked.
          const { workdirPrefix, baselinesRelPosix, prefix } = deriveFrames(workdir, baselinesRel);

          // Files currently on disk under baselines (post-approve desired state),
          // each re-anchored to the repo-root frame via toRepoPath so onDisk,
          // atHead, prefix, and the git-tree API all agree — correct for both
          // working-directory '.' and a subdir.
          const onDisk = walk(baselinesAbs, fs).map(file => {
            const rel = path.relative(workdir, file).split(path.sep).join('/');
            return { repoPath: toRepoPath(rel, workdirPrefix, prefix), absPath: file };
          });

          // Files under baselines at the head commit (to compute deletions).
          // git resolves the pathspec against cwd (= workdir), so pass the
          // workdir-relative prefix, then re-anchor each name to repo-root.
          let atHead = [];
          try {
            const listed = execFileSync('git', ['ls-tree', '-r', '--name-only', headSha, '--', baselinesRelPosix], {
              cwd: workdir, encoding: 'utf8',
            });
            atHead = listed.split('\n').map(name => name.trim()).filter(Boolean)
              .map(name => toRepoPath(name, workdirPrefix, prefix));
          } catch (error) {
            // A scope rejection on a head-listed path is a security signal, not a
            // bootstrap: re-throw it so it fail-closes. Only the genuine "no tree
            // at head" ls-tree error is swallowed as bootstrap.
            if (error instanceof BaselineScopeError) throw error;
            core.info(`No baselines at head (${error.message}); treating as bootstrap.`);
          }

          const deletions = computeDeletions(onDisk.map(file => file.repoPath), atHead);

          // Build tree entries: blobs for present files, null-sha deletions.
          // Blob creation is a content-generating POST per file; a real baseline
          // set is 100+ files and a tight loop trips GitHub's secondary rate
          // limit. Pace to ~1 request/second (GitHub's documented guidance) and
          // retry 403/429 honoring Retry-After.
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const createBlobPaced = async (payload) => {
            for (let attempt = 0; ; attempt++) {
              try {
                return await github.rest.git.createBlob(payload);
              } catch (error) {
                const status = error.status;
                const retryable = (status === 403 || status === 429) && attempt < 5;
                if (!retryable) throw error;
                const retryAfter =
                  Number(error.response && error.response.headers && error.response.headers['retry-after']) ||
                  Math.min(120, 15 * 2 ** attempt);
                core.info(`Rate limited creating blob; waiting ${retryAfter}s (attempt ${attempt + 1}/5).`);
                await sleep(retryAfter * 1000);
              }
            }
          };
          const tree = [];
          for (const file of onDisk) {
            const content = fs.readFileSync(file.absPath);
            const blob = await createBlobPaced({
              owner, repo, content: content.toString('base64'), encoding: 'base64',
            });
            tree.push({ path: file.repoPath, mode: '100644', type: 'blob', sha: blob.data.sha });
            await sleep(1000);
          }
          for (const deletionPath of deletions) {
            tree.push({ path: deletionPath, mode: '100644', type: 'blob', sha: null });
          }

          if (tree.length === 0) {
            core.info('No baseline changes to commit.');
            return;
          }

          const headCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
          const newTree = await github.rest.git.createTree({
            owner, repo, base_tree: headCommit.data.tree.sha, tree,
          });
          const commit = await github.rest.git.createCommit({
            owner, repo,
            message: 'chore(tuffgal): approve candidate baselines',
            tree: newTree.data.sha,
            parents: [headSha],
            author: { name: process.env.GIT_USER_NAME, email: process.env.GIT_USER_EMAIL },
            committer: { name: process.env.GIT_USER_NAME, email: process.env.GIT_USER_EMAIL },
          });

          // Fast-forward the head branch to the new commit. Refuse to update if
          // the branch advanced since we resolved it (avoid clobbering).
          try {
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${headRef}`, sha: commit.data.sha, force: false,
            });
          } catch (error) {
            core.setFailed(`Could not fast-forward heads/${headRef}: ${error.message}. The branch may have moved; re-run approval.`);
            return;
          }

          await github.rest.reactions.createForIssueComment({
            owner, repo, comment_id: Number(process.env.COMMENT_ID), content: 'rocket',
          });

          // Whether the commit was made with the default GITHUB_TOKEN. GitHub
          // does not fire workflows for GITHUB_TOKEN pushes (recursion
          // prevention), so with the default token the visual check will NOT
          // re-run on its own — tell the maintainer how to kick it. A custom
          // PAT / App token pushes like a normal user, so the check re-runs.
          const tokenIsDefault = process.env.TOKEN_IS_DEFAULT === 'true';
          const committed = `🚀 Committed candidate baselines to \`${headRef}\` as [\`${commit.data.sha.slice(0, 7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${commit.data.sha}).`;
          const tail = tokenIsDefault
            ? [
                '',
                '⚠️ The visual regression check will **not** re-run on its own — GitHub does not trigger workflows for commits pushed with `GITHUB_TOKEN`. Kick it with any of:',
                '',
                '- close and reopen this PR,',
                '- push an empty commit (`git commit --allow-empty -m "retrigger" && git push`), or',
                '- re-run the visual workflow from the **Actions** tab.',
                '',
                'To make the check clear itself automatically, pass a PAT / GitHub App token via the `token` input (see the README trade-off).',
              ]
            : [
                '',
                'The visual regression check will re-run automatically against the new baselines and should pass.',
              ];
          await github.rest.issues.createComment({
            owner, repo, issue_number: Number(process.env.PR_NUMBER),
            body: ['<!-- tuffgal-approve -->', committed, ...tail].join('\n'),
          });
